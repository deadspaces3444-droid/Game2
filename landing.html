<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой портал — Выбор игры</title>
    <link rel="stylesheet" href="/static/css/landing.css">
</head>
<body>

<!-- ============ ЛЕНДИНГ: ОГРОМНЫЙ КОРАБЛЬ ============ -->
<div class="landing-wrap">
    <div class="hero-ship-scene">
        <div class="ocean-waves">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
        </div>
        <div class="ship-silhouette">
            <img src="/static/images/hero-ship.png" alt="Корабль" class="ship-img"
                 onerror="this.style.display='none'; document.querySelector('.ship-fallback').style.display='flex'">
            <div class="ship-fallback" style="display:none">
                <span class="ship-emoji">⛵</span>
            </div>
        </div>
        <div class="hero-overlay-gradient"></div>
    </div>

    <div class="hero-content">
        <h1 class="hero-title">Игровой портал гильдий</h1>
        <p class="hero-subtitle">Выбери свою игру и присоединяйся к гильдии</p>
    </div>

    <!-- ============ ВЫБОР ИГРЫ ============ -->
    <div class="game-selector">
        <h2 class="selector-title">Выбор игры</h2>
        <div class="game-grid">
            {% for game in games %}
            <a href="/game/{{ game.id }}" class="game-card" style="--game-color: {{ game.color }}">
                <div class="game-card-bg" style="background-image: url('/static/{{ game.bg }}')"></div>
                <div class="game-card-overlay"></div>
                <div class="game-card-content">
                    <div class="game-card-icon">{{ game.icon }}</div>
                    <h3 class="game-card-name">{{ game.name }}</h3>
                    <p class="game-card-desc">{{ game.description }}</p>
                    <div class="game-card-cta">
                        <span>Войти</span>
                        <span class="arrow">→</span>
                    </div>
                </div>
            </a>
            {% endfor %}

            <!-- Карточка "Скоро" -->
            <div class="game-card game-card-soon">
                <div class="game-card-overlay"></div>
                <div class="game-card-content">
                    <div class="game-card-icon">🔒</div>
                    <h3 class="game-card-name">Скоро</h3>
                    <p class="game-card-desc">Новые игры на подходе</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ ФУТЕР ============ -->
    <footer class="landing-footer">
        <div class="footer-left">Mist Time — Сергеев С.В. · v3.0.0</div>
        <div class="footer-right">Игровой портал гильдий</div>
    </footer>
</div>

<script>
// Тема
(function(){
    const t = localStorage.getItem('app_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
})();

// Анимация появления карточек
document.querySelectorAll('.game-card').forEach((card, i) => {
    card.style.animationDelay = (i * 0.15) + 's';
});
</script>
</body>
</html>
