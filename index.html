<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой портал гильдий</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <button class="theme-btn" id="themeToggle">🌓</button>

    <div class="ocean-scene">
        <!-- Moon -->
        <div class="moon"></div>

        <!-- Stars -->
        <div class="stars"></div>

        <!-- Title -->
        <div class="landing-title">
            <h1>⚓ Игровой портал гильдий</h1>
            <p>Выбери свою игру и присоединяйся к команде</p>
        </div>

        <!-- Big CSS Ship -->
        <div class="big-ship">
            <svg class="ship-svg" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Hull -->
                <path d="M 30 140 Q 150 120 270 140 L 250 170 Q 150 185 50 170 Z"
                      fill="#3a2a1a" stroke="#2a1a0a" stroke-width="2"/>
                <!-- Hull planks -->
                <path d="M 40 150 Q 150 135 260 150" stroke="#2a1a0a" stroke-width="1" fill="none"/>
                <path d="M 45 160 Q 150 145 255 160" stroke="#2a1a0a" stroke-width="1" fill="none"/>

                <!-- Deck -->
                <ellipse cx="150" cy="138" rx="120" ry="8" fill="#5a3a2a"/>

                <!-- Main mast -->
                <rect x="148" y="40" width="4" height="100" fill="#3a2a1a"/>
                <!-- Front mast -->
                <rect x="90" y="60" width="4" height="80" fill="#3a2a1a"/>
                <!-- Rear mast -->
                <rect x="210" y="55" width="4" height="85" fill="#3a2a1a"/>

                <!-- Main sail -->
                <path d="M 80 50 Q 150 45 220 50 L 218 120 Q 150 115 82 120 Z"
                      fill="#e8e0d0" stroke="#b8a890" stroke-width="1"/>
                <!-- Sail detail -->
                <path d="M 150 50 L 150 120" stroke="#c8b8a0" stroke-width="1"/>

                <!-- Front sail (smaller) -->
                <path d="M 70 65 Q 92 62 114 65 L 112 120 Q 92 117 72 120 Z"
                      fill="#d8d0c0" stroke="#a8988 0" stroke-width="1"/>

                <!-- Rear sail -->
                <path d="M 190 60 Q 212 57 234 60 L 232 120 Q 212 117 190 120 Z"
                      fill="#d8d0c0" stroke="#a89880" stroke-width="1"/>

                <!-- Flag on top -->
                <path d="M 150 40 L 175 45 L 150 50 Z" fill="#ff7a7a"/>
                <line x1="150" y1="30" x2="150" y2="50" stroke="#3a2a1a" stroke-width="2"/>

                <!-- Cannons -->
                <rect x="60" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>
                <rect x="80" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>
                <rect x="100" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>
                <rect x="190" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>
                <rect x="210" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>
                <rect x="230" y="135" width="8" height="6" rx="2" fill="#1a1a1a"/>

                <!-- Windows -->
                <circle cx="70" cy="155" r="3" fill="#3b82f6" opacity=".6"/>
                <circle cx="90" cy="158" r="3" fill="#3b82f6" opacity=".6"/>
                <circle cx="110" cy="160" r="3" fill="#3b82f6" opacity=".6"/>
                <circle cx="190" cy="160" r="3" fill="#3b82f6" opacity=".6"/>
                <circle cx="210" cy="158" r="3" fill="#3b82f6" opacity=".6"/>
                <circle cx="230" cy="155" r="3" fill="#3b82f6" opacity=".6"/>

                <!-- Anchor -->
                <line x1="260" y1="140" x2="260" y2="160" stroke="#1a1a1a" stroke-width="2"/>
                <path d="M 253 155 Q 260 165 267 155" stroke="#1a1a1a" stroke-width="2" fill="none"/>
                <line x1="255" y1="150" x2="265" y2="150" stroke="#1a1a1a" stroke-width="2"/>

                <!-- Bow decoration -->
                <path d="M 270 140 L 285 130 L 275 145 Z" fill="#5a3a2a" stroke="#2a1a0a" stroke-width="1"/>
            </svg>
        </div>

        <!-- Fog -->
        <div class="fog"></div>

        <!-- Waves -->
        <div class="waves-container">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
        </div>

        <!-- Game Selection -->
        <div class="game-select-wrap">
            <div class="game-select-label">Выбор игры</div>
            <div class="game-cards" id="gameCards">
                <!-- Game cards will be inserted here by JS -->
            </div>
        </div>
    </div>

    <div class="landing-footer">
        Mist Time — Сергеев С.В · v3.0.0
    </div>

    <script src="js/storage.js"></script>
    <script src="js/landing.js"></script>
</body>
</html>
